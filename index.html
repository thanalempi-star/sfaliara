<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#120d24">
<meta name="description" content="Σφαλιάρα! Χαστούκια, μπουνιές και κλωτσιές στον Υπουργό, τον Εφοριακό, τον Τηλεμαϊντανό και τον Μάστορα. Το πιο ελληνικό αντιστρες παιχνίδι.">
<meta property="og:title" content="Σφαλιάρα! 👋">
<meta property="og:description" content="Βγάλε τα νεύρα σου στον Εφοριακό και στον Μάστορα που δεν ήρθε ποτέ.">
<meta property="og:image" content="og.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Σφαλιάρα">
<title>Σφαλιάρα!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,500;0,700;0,900;1,900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#0d0a1c;color:#fff;font-family:Rubik,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;user-select:none;-webkit-user-select:none}
body{background:
 radial-gradient(60% 45% at 50% 38%,#3b2a78 0%,transparent 70%),
 radial-gradient(40% 30% at 15% 10%,#ff2e6340 0%,transparent 70%),
 radial-gradient(40% 30% at 85% 15%,#5b8cff35 0%,transparent 70%),
 linear-gradient(#150f2e,#0b0817)}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
.spot{position:fixed;inset:0;pointer-events:none;background:conic-gradient(from 180deg at 50% -10%,transparent 168deg,#ffffff0d 176deg,#ffffff14 180deg,#ffffff0d 184deg,transparent 192deg)}
.hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 12px) 14px 0;display:flex;flex-direction:column;gap:10px;pointer-events:none}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{font-weight:900;font-style:italic;font-size:22px;letter-spacing:.5px;background:linear-gradient(180deg,#fff 20%,#ffb3c8);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #ff2e63) drop-shadow(0 6px 14px #ff2e6355)}
.pill{pointer-events:auto;display:flex;align-items:center;gap:8px;background:#ffffff12;border:1px solid #ffffff22;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:999px;padding:8px 14px;font-weight:700;font-size:15px;box-shadow:0 8px 24px #0005}
#coins{font-variant-numeric:tabular-nums;color:#ffd43b}
.charBtn{pointer-events:auto;cursor:pointer;color:#fff;font:inherit;text-align:left;display:flex;flex-direction:column;background:#ffffff10;border:1px solid #ffffff22;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:16px;padding:8px 12px;box-shadow:0 8px 24px #0005}
.charBtn b{font-size:15px}.charBtn small{font-size:11.5px;opacity:.65}
.charBtn em{font-style:normal;font-size:11px;color:#ff86a8;font-weight:700;margin-top:2px}
.dmg{flex:1;max-width:260px;background:#ffffff10;border:1px solid #ffffff22;border-radius:14px;padding:7px 10px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.dmg .lbl{display:flex;justify-content:space-between;font-size:11px;font-weight:700;letter-spacing:1px;opacity:.85;margin-bottom:5px}
.bar{height:10px;border-radius:99px;background:#00000055;overflow:hidden}
#dmgFill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#ffd43b,#ff7b2e 50%,#ff2e63);box-shadow:0 0 12px #ff2e63aa;transition:width .25s cubic-bezier(.2,.8,.2,1)}
#combo{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 128px);transform:translateX(-50%) scale(.6);opacity:0;font-weight:900;font-style:italic;font-size:30px;color:#ffd43b;text-shadow:0 3px 0 #b3261e,0 0 24px #ff7b2e;pointer-events:none;transition:opacity .25s,transform .25s}
#combo.on{opacity:1;transform:translateX(-50%) scale(1)}
#combo.bump{animation:bump .25s}
@keyframes bump{40%{transform:translateX(-50%) scale(1.3)}}
#hint{position:fixed;left:50%;top:46%;transform:translate(-50%,-50%);background:#000a;border:1px solid #ffffff30;padding:10px 16px;border-radius:999px;font-weight:700;font-size:15px;pointer-events:none;animation:pulse 1.4s ease-in-out infinite;transition:opacity .3s}
#hint.gone{opacity:0}
@keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.07)}}
.tools{position:fixed;left:0;right:0;bottom:0;padding:12px 10px calc(env(safe-area-inset-bottom) + 14px);display:flex;justify-content:center;gap:8px;background:linear-gradient(transparent,#0b0817dd 40%)}
.tool{flex:1;max-width:96px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px 9px;border-radius:20px;border:1px solid #ffffff1f;background:#ffffff0d;color:#fff;font:inherit;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:transform .15s,background .2s,border-color .2s,box-shadow .2s}
.tool:active{transform:scale(.92)}
.ti{font-size:30px;line-height:1;filter:drop-shadow(0 4px 6px #0007)}
.tl{font-size:11.5px;font-weight:700;opacity:.8}
.tool.active{background:linear-gradient(160deg,#ff2e63,#b0195a);border-color:#ff8fb0;box-shadow:0 10px 26px #ff2e6366,inset 0 1px 0 #ffffff60;transform:translateY(-4px)}
.tool.active .tl{opacity:1}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.pow{position:absolute;--c:#fff;font-weight:900;font-style:italic;font-size:42px;color:var(--c);-webkit-text-stroke:2px #1a0b2e;paint-order:stroke fill;text-shadow:0 5px 0 #ff2e63,0 10px 24px #0008;transform:translate(-50%,-50%) rotate(var(--r));animation:pow .8s cubic-bezier(.2,1.6,.4,1) forwards;white-space:nowrap}
@keyframes pow{0%{transform:translate(-50%,-50%) rotate(var(--r)) scale(.2);opacity:0}15%{opacity:1;transform:translate(-50%,-90%) rotate(var(--r)) scale(1.15)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-170%) rotate(var(--r)) scale(.9)}}
.coinfly{position:absolute;font-weight:900;color:#ffd43b;font-size:18px;text-shadow:0 2px 6px #000;animation:cf .9s ease-out forwards;transform:translate(-50%,0)}
@keyframes cf{to{transform:translate(-50%,-80px);opacity:0}}
#ko{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#0000 0,#000a 80%);opacity:0;pointer-events:none;transition:opacity .35s}
#ko.on{opacity:1;pointer-events:auto}
.koBox{text-align:center;transform:scale(.6);transition:transform .45s cubic-bezier(.2,1.6,.4,1);padding:24px}
#ko.on .koBox{transform:scale(1)}
.koT{font-size:92px;font-weight:900;font-style:italic;line-height:1;background:linear-gradient(#fff 30%,#ffd43b);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 0 #ff2e63) drop-shadow(0 18px 30px #000)}
.koS{margin:10px 0 4px;font-size:22px;font-weight:900;color:#ffd43b}
.koH{opacity:.7;font-size:14px;margin-bottom:22px}
.btn{cursor:pointer;font:inherit;font-weight:900;font-size:17px;color:#fff;border:0;border-radius:18px;padding:15px 26px;background:linear-gradient(160deg,#ff2e63,#b0195a);box-shadow:0 12px 30px #ff2e6366,inset 0 1px 0 #ffffff70;margin:5px}
.btn.ghost{background:#ffffff14;box-shadow:inset 0 0 0 1px #ffffff30}
#sheet{position:fixed;inset:0;background:#0009;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
#sheet.on{opacity:1;pointer-events:auto}
.panel{width:100%;max-width:520px;background:linear-gradient(#211a42,#141029);border:1px solid #ffffff1f;border-bottom:0;border-radius:28px 28px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px);transform:translateY(40px);transition:transform .3s cubic-bezier(.2,1,.3,1);max-height:85vh;overflow:auto}
#sheet.on .panel{transform:none}
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.ph h2{font-size:21px;font-weight:900;font-style:italic}
.x{cursor:pointer;background:#ffffff14;border:0;color:#fff;width:36px;height:36px;border-radius:50%;font-size:18px}
#need{font-size:13px;opacity:.7;margin-bottom:14px}
#roster{display:flex;flex-direction:column;gap:10px}
.card{cursor:pointer;display:flex;align-items:center;gap:12px;text-align:left;font:inherit;color:#fff;background:#ffffff0b;border:1px solid #ffffff1a;border-radius:20px;padding:10px 12px;transition:transform .15s,border-color .2s}
.card:active{transform:scale(.98)}
.card.sel{border-color:#ff5c8a;background:#ff2e6318;box-shadow:0 0 0 1px #ff2e6355 inset}
.card.locked .avatar{filter:grayscale(.85) brightness(.7)}
.card.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.avatar{position:relative;width:54px;height:54px;flex:none;border-radius:16px;background:radial-gradient(circle at 50% 30%,#4b3a8f,#1a1433);overflow:hidden}
.avatar i{position:absolute;left:50%;transform:translateX(-50%);display:block}
.a-body{bottom:-12px;width:42px;height:26px;border-radius:20px 20px 0 0;background:var(--suit)}
.a-head{top:10px;width:28px;height:30px;border-radius:50%;background:var(--skin);box-shadow:inset -4px -4px 0 #0002}
.a-hair{top:7px;width:30px;height:14px;border-radius:15px 15px 4px 4px;background:var(--hair);z-index:2}
.cinfo{flex:1;display:flex;flex-direction:column}
.cinfo b{font-size:16px}.cinfo small{opacity:.6;font-size:12.5px}
.cprice{font-size:12.5px;font-weight:700;white-space:nowrap;background:#ffffff12;padding:7px 10px;border-radius:999px}
.card.sel .cprice{background:#ff2e63}
.foot{margin-top:14px;font-size:11px;opacity:.45;text-align:center}
#bubble{position:fixed;transform:translate(-50%,-100%) scale(.5);opacity:0;pointer-events:none;background:#fff;color:#1a1033;font-weight:800;font-size:15px;padding:9px 14px;border-radius:18px;max-width:230px;text-align:center;box-shadow:0 10px 30px #0006;transition:opacity .2s,transform .25s cubic-bezier(.2,1.6,.4,1)}
#bubble::after{content:"";position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);border:9px solid transparent;border-bottom:0;border-top-color:#fff}
#bubble.on{opacity:1;transform:translate(-50%,-100%) scale(1)}
@media (min-width:760px){.tools{gap:14px}.tool{max-width:110px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="spot"></div>
<div class="hud">
  <div class="row">
    <div class="logo">ΣΦΑΛΙΑΡΑ!</div>
    <div class="pill">🪙 <span id="coins">0</span></div>
  </div>
  <div class="row">
    <button class="charBtn" id="charBtn"><b id="charName">…</b><small id="charTag"></small><em>Αλλαγή ▸</em></button>
    <div class="dmg"><div class="lbl"><span>ΖΗΜΙΑ</span><span id="dmgPct">0%</span></div><div class="bar"><div id="dmgFill"></div></div></div>
  </div>
</div>
<div id="combo"></div>
<div id="hint">👆 Πάτα πάνω του!</div>
<div id="fx"></div>
<div id="bubble"></div>
<div class="tools" id="tools"></div>
<div id="ko"><div class="koBox">
  <div class="koT">K.O.!</div>
  <div class="koS" id="koBonus">+50 🪙</div>
  <div class="koH" id="koHits"></div>
  <button class="btn" id="again">Ξανά γύρος</button>
  <button class="btn ghost" id="koSwitch">Άλλος στόχος</button>
</div></div>
<div id="sheet"><div class="panel">
  <div class="ph"><h2>Διάλεξε στόχο</h2><button class="x" id="sheetClose">✕</button></div>
  <p id="need"></p>
  <div id="roster"></div>
  <p class="foot">Όλοι οι χαρακτήρες είναι φανταστικές καρικατούρες.</p>
</div></div>
